# /etc/nginx/sites-available/prajavarta.conf
# Symlink to sites-enabled: ln -s /etc/nginx/sites-available/prajavarta.conf /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name prajavarta.com www.prajavarta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prajavarta.com www.prajavarta.com;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/prajavarta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prajavarta.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Logging
    access_log /var/log/nginx/prajavarta.access.log;
    error_log  /var/log/nginx/prajavarta.error.log;

    # Security headers (Next.js also adds some — these are at the edge)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # Max upload size (for admin image uploads — must match Next.js limit)
    client_max_body_size 10M;

    # Static assets — long cache, served directly from .next/static
    location /_next/static/ {
        alias /var/www/prajavarta/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded media files
    location /uploads/ {
        alias /var/www/prajavarta/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public static files (favicon, icons, content-architecture-logic.html, etc.)
    location /public/ {
        alias /var/www/prajavarta/public/;
        expires 30d;
        access_log off;
    }

    # Proxy everything else to Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
